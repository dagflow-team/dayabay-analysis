stages:
  - tests

variables:
  PYPI_INDEX: https://pypi-mirror.gitverse.ru/simple/

tests:
  image: 'python:3.12.14-bookworm'
  stage: tests

  script:
    - apt-get update
    - apt-get -y install libgraphviz-dev graphviz git-lfs
    - python3 -m venv venv
    - source venv/bin/activate
    - git lfs install --skip-repo
    - pip install --no-cache-dir --upgrade wheel setuptools pip --index-url $PYPI_INDEX
    - pip install --no-cache-dir cython --index-url $PYPI_INDEX
    - pip install --no-cache-dir -r requirements.txt --index-url $PYPI_INDEX
    - PYTHONPATH=$PWD coverage run --source=. -m pytest
    - coverage report
    - coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    paths:
      - output
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  only:
    - master
    - main
    - merge_requests
